<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Science Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eaf4ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Science Lab</title>
<style>
:root{
  --bg:#eaf4ff; --ink:#1f2a44; --muted:#5b6785; --card:#ffffff; --line:#d6e2f3;
  --accent:#3b82f6; --good:#16a34a; --bad:#e11d48; --sun:#fbbf24;
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none;-webkit-touch-callout:none}
body{
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;
  color:var(--ink);background:linear-gradient(160deg,#eaf4ff,#f6efff);
  -webkit-user-select:none;user-select:none;font-size:18px;
}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
h1,h2,h3,p{margin:0}

.btn{background:var(--accent);color:#fff;font-weight:800;font-size:1.1rem;padding:14px 22px;border-radius:999px;
  box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s,opacity .2s;min-height:54px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}

/* ---------- start / profile screens ---------- */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;overflow:auto}
.logo{font-size:5rem;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(4deg)}}
.title{font-size:2.6rem;font-weight:900;letter-spacing:.5px}
.sub{color:var(--muted);font-size:1.15rem}
.who{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.who-card{position:relative;background:var(--card);border-radius:var(--r);padding:20px 26px;min-width:170px;box-shadow:0 6px 0 var(--line);
  display:flex;flex-direction:column;align-items:center;gap:6px}
.who-card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.who-card .av{font-size:3.4rem}
.who-card .nm{font-weight:900;font-size:1.3rem}
.who-card .lv{color:var(--muted);font-size:.95rem}
.who-card.add{border:3px dashed #b9c8e2;background:transparent;box-shadow:none;color:var(--muted);justify-content:center}
.who-del{position:absolute;top:6px;right:8px;background:none;color:#b3bdd1;font-size:1.1rem;padding:6px}
.form{background:var(--card);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;gap:18px;max-width:560px;width:100%;box-shadow:0 6px 0 var(--line);text-align:left}
.form label{font-weight:800}
.form input[type=text]{font:inherit;font-size:1.3rem;padding:12px 16px;border-radius:14px;border:3px solid var(--line);width:100%;-webkit-user-select:text;user-select:text}
.pick{display:flex;flex-wrap:wrap;gap:10px}
.pick button{background:#f1f6ff;border:3px solid transparent;border-radius:16px;padding:10px 14px;font-size:1.6rem;min-width:58px}
.pick button.on{border-color:var(--accent);background:#dbeafe}
.pick.lvl button{font-size:1.05rem;font-weight:800;flex:1;text-align:left;line-height:1.3}
.pick.lvl small{display:block;font-weight:600;color:var(--muted)}

/* ---------- home ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.topbar .grow{flex:1;min-width:0}
.chip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:800;font-size:.95rem;min-height:44px;white-space:nowrap}
.home{flex:1;overflow:auto;padding:22px;-webkit-overflow-scrolling:touch}
.cat{font-size:1.2rem;font-weight:900;margin:18px 4px 12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{position:relative;background:var(--card);border-radius:var(--r);padding:20px;text-align:left;box-shadow:0 6px 0 var(--line);
  border-top:10px solid var(--c);display:flex;flex-direction:column;gap:8px;min-height:170px}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.card .em{font-size:3.2rem}
.card .t{font-weight:900;font-size:1.3rem}
.card .d{color:var(--muted);font-size:.98rem}
.card .star{position:absolute;top:12px;right:14px;font-size:1.8rem;filter:grayscale(1);opacity:.25}
.card .star.got{filter:none;opacity:1}

/* ---------- experiment ---------- */
.exp{flex:1;display:flex;flex-direction:column;min-height:0}
.exp .topbar{border-bottom-color:var(--accent)}
.exp-title{font-weight:900;font-size:1.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--accent);opacity:.5}
.dots i.now{background:var(--accent);width:30px;border-radius:8px}
.exp-main{flex:1;min-height:0;display:grid;grid-template-columns:1.55fr 1fr;gap:14px;padding:14px}
@media (orientation:portrait){.exp-main{grid-template-columns:1fr;grid-template-rows:56% 1fr}}
.stage{background:var(--card);border-radius:var(--r);box-shadow:0 6px 0 var(--line);overflow:hidden;display:flex;flex-direction:column;min-height:0;position:relative}
.stage svg{flex:1;min-height:0;width:100%;display:block;touch-action:none}
.stage svg text{font-family:inherit;pointer-events:none}
.stage svg .item{cursor:grab}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 14px;border-top:2px solid var(--line);background:#f8fbff}
.controls:empty{display:none}
.controls label{font-weight:800;display:flex;align-items:center;gap:10px}
.controls input[type=range]{width:190px;height:34px;accent-color:var(--accent)}
.controls .read{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.mini{background:#fff;border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:800;min-height:44px}
.seg{display:flex;align-items:center;gap:6px}
.seg-l{font-weight:800;margin-right:4px}
.seg-b{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:800;min-width:46px;min-height:44px}
.seg-b.on{background:var(--accent);color:#fff;border-color:var(--accent)}

.panel{background:var(--card);border-radius:var(--r);box-shadow:0 6px 0 var(--line);padding:20px;display:flex;flex-direction:column;gap:14px;overflow:auto;-webkit-overflow-scrolling:touch;min-height:0}
.panel h2{font-size:1.5rem;font-weight:900;color:var(--accent);display:flex;align-items:center;gap:10px}
.panel h2 .say{margin-left:auto}
.say{background:#f1f6ff;border-radius:50%;width:46px;height:46px;font-size:1.3rem;flex:none}
.narr{font-size:1.2rem;line-height:1.55}
.big .narr{font-size:1.45rem;line-height:1.6}
.sent{border-radius:8px;padding:1px 2px;transition:background .15s}
.sent.on{background:#fff0a3}
.note{background:#fff8dc;border:3px solid var(--sun);border-radius:18px;padding:14px 16px;position:relative}
.note.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.goals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.goals li{display:flex;gap:10px;align-items:center;font-weight:700;font-size:1.05rem;color:var(--muted)}
.goals li::before{content:"";width:26px;height:26px;border-radius:8px;border:3px solid var(--line);flex:none;display:grid;place-items:center}
.goals li.done{color:var(--good)}
.goals li.done::before{content:"✓";background:var(--good);border-color:var(--good);color:#fff;font-weight:900}
.spacer{flex:1}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:#f1f6ff;border:3px solid var(--line);border-radius:16px;padding:14px 16px;font-weight:800;font-size:1.15rem;text-align:left;min-height:58px}
.opt.on{border-color:var(--accent);background:#dbeafe}
.opt.right{border-color:var(--good);background:#dcfce7}
.opt.wrong{border-color:var(--bad);background:#ffe4e6;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.homebox{background:#f0fdf4;border:3px solid #86efac;border-radius:18px;padding:14px 16px}
.homebox h3{font-size:1.1rem;margin-bottom:6px}
.homebox .narr{font-size:1.05rem}
.safety{color:var(--bad);font-weight:800;margin-top:6px;font-size:1rem}

.hero{flex:1;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--accent) 22%,#fff),#fff 70%)}
.hero .main{font-size:min(30vh,34vw,11rem);animation:bob 3s ease-in-out infinite}
.hero .bit{position:absolute;font-size:2.6rem;animation:bob 4s ease-in-out infinite}
.results{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px}
.pred{border-radius:18px;padding:16px 18px;font-size:1.15rem;font-weight:700;background:#f1f6ff;border:3px solid var(--line)}
.pred.ok{background:#dcfce7;border-color:#86efac}
.pred.no{background:#fff8dc;border-color:var(--sun)}
.pred b{display:block;font-size:1.35rem;margin-top:4px}
.obs{display:flex;flex-wrap:wrap;gap:10px}
.obs span{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:800}
.results h3{font-size:1.1rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.starwin{flex:1;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,#fff7cf,#fff 70%)}
.starwin .s{font-size:9rem;animation:spin 1s cubic-bezier(.2,1.6,.4,1)}
@keyframes spin{from{transform:scale(0) rotate(-200deg)}}
.starwin h2{font-size:2rem}

#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.conf{position:absolute;top:-50px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
.ray{stroke-dasharray:16 12;animation:dash .9s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
</style>
</head>
<body>
<div id="app"></div>
<div id="fx"></div>

<script>
'use strict';
/* =====================================================================
   SCIENCE LAB
   ---------------------------------------------------------------------
   HOW TO ADD A NEW EXPERIMENT
   Scroll to section 5 and add one more  Lab.register({...})  block.
   The shell (menu, steps, narration, stars, quiz) needs no changes.

   Lab.register({
     id, title, emoji, color, category, blurb, bits:[emoji...],
     question:     {explorer, scientist},
     predict:      {explorer:{prompt, options:[...], answer:index}, scientist:{...}},
     instructions: {explorer, scientist},
     goals:        {explorer:[{id,label}], scientist:[{id,label}]},
     build(ctx),            // draws the interactive scene (see ctx below)
     observations(data,lv), // -> ["🍎 Apple floats", ...] shown on the Results step
     result(lv,data),       // -> text: what happened
     why:          {explorer, scientist},
     whyAnim(ctx),          // small looping animation that explains why
     home:         {explorer, scientist},  safety: "optional warning",
     quiz:         {explorer:[{q, options:[...], answer:index}], scientist:[...]}
   });

   ctx = { svg (800x600 drawing area), controls (HTML bar under the stage),
           scene.loop(fn(dt,t)), scene.after(ms,fn), level, sci (true = Scientist),
           data (your observations), note(text) (caption + voice), goal(id) }
   Text values may be a plain string or {explorer:'..', scientist:'..'}.
   ===================================================================== */

/* ===================== 1. Helpers ===================== */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return e;
}
const NS = 'http://www.w3.org/2000/svg';
function S(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) { if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  if (parent) parent.appendChild(e);
  return e;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function svgPoint(svg, ev) {
  const m = svg.getScreenCTM();
  if (!m) return { x: 0, y: 0 };
  const p = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(m.inverse());
  return { x: p.x, y: p.y };
}
/* Touch + mouse dragging on an SVG element. */
function drag(el, svg, hnd) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    const p0 = svgPoint(svg, e);
    let last = p0;
    hnd.start && hnd.start(p0);
    const id = e.pointerId;
    const mv = ev => { if (ev.pointerId !== id) return; last = svgPoint(svg, ev); hnd.move && hnd.move(last, p0); };
    const up = ev => {
      if (ev.pointerId !== id) return;
      window.removeEventListener('pointermove', mv);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      if (ev.type === 'pointerup') { last = svgPoint(svg, ev); hnd.move && hnd.move(last, p0); }
      hnd.end && hnd.end(last, p0);
    };
    window.addEventListener('pointermove', mv);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });
}
function emojiItem(parent, emoji, size) {
  const g = S('g', { class: 'item' }, parent);
  S('circle', { r: size * 0.68, fill: 'transparent' }, g);
  S('text', { 'font-size': size, 'text-anchor': 'middle', dy: '.35em', text: emoji }, g);
  return g;
}
function label(parent, x, y, text, size = 18, fill = '#5b6785', anchor = 'middle', weight = 800) {
  return S('text', { x, y, 'font-size': size, 'text-anchor': anchor, fill, 'font-weight': weight, text }, parent);
}
function seg(text, opts, cur, onPick) {
  const wrap = h('div', { class: 'seg' }, h('span', { class: 'seg-l' }, text));
  opts.forEach(o => {
    const b = h('button', { class: 'seg-b' + (o.v === cur ? ' on' : ''), onclick: () => {
      wrap.querySelectorAll('.seg-b').forEach(x => x.classList.remove('on'));
      b.classList.add('on'); onPick(o.v);
    } }, o.t);
    wrap.append(b);
  });
  return wrap;
}
function listWords(a) {
  if (!a.length) return '';
  if (a.length === 1) return a[0];
  return a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function confetti(n = 28) {
  const fx = $('#fx'), set = ['⭐', '✨', '🎉', '🌟'];
  for (let i = 0; i < n; i++) {
    const s = h('span', { class: 'conf', style: `left:${Math.random() * 100}%;animation-delay:${Math.random() * .5}s;font-size:${18 + Math.random() * 24}px` }, set[i % 4]);
    fx.append(s); setTimeout(() => s.remove(), 3000);
  }
}
/* Animation loop + timers that are cleaned up automatically when a step ends. */
class Scene {
  constructor() {
    this.loops = new Set(); this.timers = new Set(); this.alive = true; this.last = 0;
    const tick = t => {
      if (!this.alive) return;
      const dt = this.last ? Math.min(0.033, (t - this.last) / 1000) : 0.016;
      this.last = t;
      this.loops.forEach(f => f(dt, t / 1000));
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }
  loop(f) { this.loops.add(f); return () => this.loops.delete(f); }
  after(ms, f) { const id = setTimeout(() => { this.timers.delete(id); if (this.alive) f(); }, ms); this.timers.add(id); }
  destroy() { this.alive = false; cancelAnimationFrame(this.raf); this.timers.forEach(clearTimeout); this.loops.clear(); }
}

/* ===================== 2. Saved players ===================== */
const Store = {
  key: 'sciencelab.v1',
  data: { profiles: [], current: null },
  load() { try { const d = JSON.parse(localStorage.getItem(this.key)); if (d && Array.isArray(d.profiles)) this.data = d; } catch (_) {} },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (_) {} },
  get me() { return this.data.profiles.find(p => p.id === this.data.current) || null; }
};

/* ===================== 3. Voice (reads text aloud) ===================== */
const Voice = {
  synth: window.speechSynthesis || null, voice: null, token: 0,
  init() {
    if (!this.synth) return;
    const pick = () => {
      const vs = this.synth.getVoices().filter(v => /^en/i.test(v.lang));
      if (!vs.length) return;
      const score = v => (/natural|neural|enhanced|premium/i.test(v.name) ? 4 : 0)
        + (/google|samantha|aria|jenny|libby|sonia|karen|daniel|ava/i.test(v.name) ? 2 : 0)
        + (/en[-_]US/i.test(v.lang) ? 2 : /en[-_]GB/i.test(v.lang) ? 1 : 0);
      this.voice = vs.sort((a, b) => score(b) - score(a))[0];
    };
    pick();
    if (this.synth.addEventListener) this.synth.addEventListener('voiceschanged', pick);
    /* iOS only allows speech after a tap: unlock it on the first touch. */
    window.addEventListener('pointerdown', () => { try { this.synth.speak(new SpeechSynthesisUtterance(' ')); } catch (_) {} }, { once: true });
  },
  clean(t) {
    return t.replace(/\p{Extended_Pictographic}|️|‍/gu, '')
      .replace(/g\/cm³/g, 'grams per cubic centimeter')
      .replace(/(\d) ml\b/g, '$1 milliliters').replace(/(\d) cm\b/g, '$1 centimeters').replace(/→/g, ' makes ')
      .replace(/(\d) V\b/g, '$1 volts').replace(/(\d) A\b/g, '$1 amps')
      .replace(/÷/g, ' divided by ').replace(/=/g, ' equals ')
      .replace(/\s\+\s/g, ' plus ').replace(/−/g, 'minus').replace(/\+/g, 'plus')
      .replace(/➜|↺/g, '');
  },
  stop() {
    this.token++;
    if (this.synth) this.synth.cancel();
    document.querySelectorAll('.sent.on').forEach(e => e.classList.remove('on'));
  },
  speak(parts, rate) {
    this.stop();
    if (!this.synth) return;
    const tk = this.token; let i = 0;
    const next = () => {
      if (tk !== this.token || i >= parts.length) return;
      const p = parts[i++], txt = this.clean(p.text).trim();
      if (!txt) return next();
      const u = new SpeechSynthesisUtterance(txt);
      if (this.voice) { u.voice = this.voice; u.lang = this.voice.lang; } else u.lang = 'en-US';
      u.rate = rate; u.pitch = 1.05;
      u.onstart = () => { if (tk === this.token && p.el) p.el.classList.add('on'); };
      u.onend = u.onerror = () => { if (p.el) p.el.classList.remove('on'); if (tk === this.token) next(); };
      this.synth.speak(u);
    };
    setTimeout(next, 70);
  }
};
function sentences(text) {
  text = String(text);
  const out = [], re = /[.!?]+(?=\s|$)/g; let last = 0;
  while (re.exec(text)) { out.push(text.slice(last, re.lastIndex).trim()); last = re.lastIndex; }
  if (last < text.length) out.push(text.slice(last).trim());
  return out.filter(Boolean);
}
/* A paragraph whose sentences light up while they are read aloud. */
function narr(text) {
  const p = h('p', { class: 'narr' });
  sentences(text).forEach(s => p.append(h('span', { class: 'sent' }, s), ' '));
  return p;
}
function readEls(els, force) {
  const me = Store.me;
  if (!me || (!me.sound && !force)) return;
  const parts = [];
  els.forEach(el => el && el.querySelectorAll('.sent').forEach(s => parts.push({ text: s.textContent, el: s })));
  if (!parts.length) return;
  Voice.speak(parts, me.level === 'explorer' ? 0.85 : 0.97);
}

/* ===================== 4. The lab shell ===================== */
const Lab = { list: [], register(x) { this.list.push(x); } };
const STEPS = ['Question', 'Predict', 'Experiment', 'Results', 'Why?', 'Quiz'];
const AVATARS = ['🦊', '🐼', '🦄', '🐯', '🐸', '🐙', '🦖', '🚀', '🦉', '🐬'];
const LEVELS = {
  explorer: { icon: '🐣', name: 'Explorer', hint: 'Short words. Everything is read aloud.' },
  scientist: { icon: '🚀', name: 'Scientist', hint: 'More detail, numbers and things to change.' }
};

const App = {
  root: null, scene: null, exp: null, step: 0, pred: null, data: {},
  start() { this.root = $('#app'); Store.me ? this.home() : this.players(); },
  clear() { if (this.scene) { this.scene.destroy(); this.scene = null; } Voice.stop(); },

  /* ---- who is playing? ---- */
  players() {
    this.clear();
    const who = h('div', { class: 'who' });
    Store.data.profiles.forEach(p => {
      const card = h('button', { class: 'who-card', onclick: () => { Store.data.current = p.id; Store.save(); this.home(); } },
        h('span', { class: 'av' }, p.avatar), h('span', { class: 'nm' }, p.name),
        h('span', { class: 'lv' }, LEVELS[p.level].icon + ' ' + LEVELS[p.level].name + '  ·  ⭐ ' + Object.keys(p.stars || {}).length));
      card.append(h('span', { class: 'who-del', role: 'button', 'aria-label': 'Remove player', onclick: e => {
        e.stopPropagation();
        if (confirm('Remove ' + p.name + ' and their stars?')) {
          Store.data.profiles = Store.data.profiles.filter(x => x.id !== p.id);
          if (Store.data.current === p.id) Store.data.current = null;
          Store.save(); this.players();
        }
      } }, '✕'));
      who.append(card);
    });
    who.append(h('button', { class: 'who-card add', onclick: () => this.addPlayer() }, h('span', { class: 'av' }, '➕'), h('span', { class: 'nm' }, 'New scientist')));
    this.root.replaceChildren(h('div', { class: 'center' },
      h('div', { class: 'logo' }, '🧪'), h('h1', { class: 'title' }, 'Science Lab'),
      h('p', { class: 'sub' }, Store.data.profiles.length ? 'Who is experimenting today?' : 'Welcome! Let’s set up your lab coat.'), who));
  },
  addPlayer() {
    let avatar = AVATARS[0], level = 'explorer';
    const name = h('input', { type: 'text', maxlength: 14, placeholder: 'Your name', autocomplete: 'off' });
    const av = h('div', { class: 'pick' });
    AVATARS.forEach(a => { const b = h('button', { class: a === avatar ? 'on' : '', onclick: () => { avatar = a; av.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); } }, a); av.append(b); });
    const lv = h('div', { class: 'pick lvl' });
    Object.keys(LEVELS).forEach(k => { const L = LEVELS[k]; const b = h('button', { class: k === level ? 'on' : '', onclick: () => { level = k; lv.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); } }, L.icon + ' ' + L.name, h('small', null, L.hint)); lv.append(b); });
    const go = () => {
      const n = name.value.trim() || 'Scientist';
      const p = { id: 'p' + Date.now(), name: n, avatar, level, sound: level === 'explorer', stars: {} };
      Store.data.profiles.push(p); Store.data.current = p.id; Store.save(); this.home();
    };
    this.root.replaceChildren(h('div', { class: 'center' }, h('div', { class: 'form' },
      h('h2', null, 'New scientist'),
      h('label', null, 'Name'), name,
      h('label', null, 'Pick your lab buddy'), av,
      h('label', null, 'Level'), lv,
      h('div', { style: 'display:flex;gap:12px;justify-content:flex-end' },
        Store.data.profiles.length ? h('button', { class: 'btn ghost', onclick: () => this.players() }, 'Back') : null,
        h('button', { class: 'btn', onclick: go }, 'Start ➜')))));
  },

  /* ---- menu of experiments ---- */
  home() {
    this.clear();
    const me = Store.me; if (!me) return this.players();
    const stars = Object.keys(me.stars || {}).length;
    const body = h('div', { class: 'home' });
    const cats = [...new Set(Lab.list.map(e => e.category))];
    cats.forEach(c => {
      body.append(h('div', { class: 'cat' }, c));
      const grid = h('div', { class: 'grid' });
      Lab.list.filter(e => e.category === c).forEach(e => grid.append(
        h('button', { class: 'card', style: `--c:${e.color}`, onclick: () => this.open(e) },
          h('span', { class: 'star' + (me.stars[e.id] ? ' got' : '') }, '⭐'),
          h('span', { class: 'em' }, e.emoji), h('span', { class: 't' }, e.title), h('span', { class: 'd' }, e.blurb))));
      body.append(grid);
    });
    this.root.replaceChildren(
      h('div', { class: 'topbar' },
        h('span', { style: 'font-size:2rem' }, me.avatar),
        h('div', { class: 'grow' }, h('div', { style: 'font-weight:900;font-size:1.3rem' }, 'Hi, ' + me.name + '!'),
          h('div', { style: 'color:var(--muted);font-size:.95rem' }, `⭐ ${stars} of ${Lab.list.length} stars`)),
        this.levelChip(() => this.home()),
        h('button', { class: 'chip', onclick: () => this.players() }, '👥 Switch')),
      body);
  },
  levelChip(after) {
    const me = Store.me, L = LEVELS[me.level];
    return h('button', { class: 'chip', onclick: () => {
      me.level = me.level === 'explorer' ? 'scientist' : 'explorer';
      Store.save(); after();
    } }, L.icon + ' ' + L.name);
  },

  /* ---- one experiment, six steps ---- */
  open(exp) { this.exp = exp; this.step = 0; this.pred = null; this.data = {}; this.render(); },
  go(n) { this.step = n; this.render(); },
  render() {
    this.clear();
    const me = Store.me, lv = me.level, exp = this.exp;
    const T = o => (o == null ? '' : typeof o === 'string' ? o : (o[lv] != null ? o[lv] : o.explorer));
    const stage = h('div', { class: 'stage' });
    const panel = h('div', { class: 'panel' + (lv === 'explorer' ? ' big' : '') });
    const dots = h('div', { class: 'dots' });
    STEPS.forEach((s, i) => dots.append(h('i', { class: i === this.step ? 'now' : i < this.step ? 'done' : '', title: s })));
    const top = h('div', { class: 'topbar' },
      h('button', { class: 'chip', onclick: () => this.home() }, '🏠'),
      h('div', { class: 'grow exp-title' }, exp.emoji + ' ' + exp.title),
      dots,
      this.levelChip(() => this.open(exp)),
      h('button', { class: 'chip', 'aria-label': 'Voice on or off', onclick: e => { me.sound = !me.sound; Store.save(); e.currentTarget.textContent = me.sound ? '🔊' : '🔇'; if (!me.sound) Voice.stop(); } }, me.sound ? '🔊' : '🔇'));
    this.root.replaceChildren(h('div', { class: 'exp', style: `--accent:${exp.color}` }, top, h('div', { class: 'exp-main' }, stage, panel)));
    this.scene = new Scene();
    const read = [];
    const head = (text) => h('h2', null, text, h('button', { class: 'say', 'aria-label': 'Read aloud', onclick: () => readEls(read, true) }, '🔊'));
    const say = (text) => { const p = narr(text); read.push(p); return p; };
    const ui = { stage, panel, T, lv, head, say, read, exp };
    [this.sQuestion, this.sPredict, this.sExperiment, this.sResults, this.sWhy, this.sQuiz][this.step].call(this, ui);
    readEls(read);
  },
  hero(exp) {
    const el = h('div', { class: 'hero' }, h('div', { class: 'main' }, exp.emoji));
    const spots = [[8, 10], [80, 14], [12, 72], [78, 70], [46, 6], [48, 82]];
    (exp.bits || []).slice(0, 6).forEach((b, i) => el.append(h('span', { class: 'bit', style: `left:${spots[i][0]}%;top:${spots[i][1]}%;animation-delay:${-i * .7}s` }, b)));
    return el;
  },
  newSvg(stage) { return S('svg', { viewBox: '0 0 800 600', preserveAspectRatio: 'xMidYMid meet' }, stage); },

  sQuestion({ stage, panel, T, head, say, exp }) {
    stage.append(this.hero(exp));
    panel.append(head('The big question'), say(T(exp.question)), h('div', { class: 'spacer' }),
      h('button', { class: 'btn', onclick: () => this.go(1) }, 'Make a prediction ➜'));
  },
  sPredict({ stage, panel, T, lv, head, say, read, exp }) {
    stage.append(this.hero(exp));
    const P = exp.predict[lv] || exp.predict.explorer;
    const next = h('button', { class: 'btn', disabled: this.pred == null, onclick: () => this.go(2) }, 'Start the experiment ➜');
    const opts = h('div', { class: 'opts' });
    P.options.forEach((o, i) => {
      const b = h('button', { class: 'opt' + (this.pred === i ? ' on' : ''), onclick: () => {
        this.pred = i; opts.querySelectorAll('.opt').forEach(x => x.classList.remove('on')); b.classList.add('on');
        next.disabled = false; next.classList.add('pulse');
      } }, h('span', { class: 'sent' }, o));
      opts.append(b);
    });
    panel.append(head('What do you think?'), say('Scientists make a guess before they test. It is called a prediction. ' + P.prompt), opts, h('div', { class: 'spacer' }), next);
    read.push(opts);
  },
  sExperiment({ stage, panel, T, lv, head, exp }) {
    const svg = this.newSvg(stage);
    const controls = h('div', { class: 'controls' }); stage.append(controls);
    const noteEl = h('div', { class: 'note' });
    const goals = (exp.goals[lv] || exp.goals.explorer);
    const list = h('ul', { class: 'goals' });
    const done = new Set();
    goals.forEach(g => list.append(h('li', { 'data-g': g.id }, g.label)));
    const next = h('button', { class: 'btn', disabled: true, onclick: () => this.go(3) }, 'What happened? ➜');
    const ctx = {
      svg, controls, scene: this.scene, level: lv, sci: lv === 'scientist', data: this.data,
      note: (text) => {
        noteEl.replaceChildren(narr(text));
        noteEl.classList.remove('pop'); void noteEl.offsetWidth; noteEl.classList.add('pop');
        readEls([noteEl]);
      },
      goal: (id) => {
        if (done.has(id) || !goals.some(g => g.id === id)) return;
        done.add(id);
        const li = list.querySelector(`[data-g="${id}"]`); if (li) li.classList.add('done');
        if (done.size === goals.length) { next.disabled = false; next.classList.add('pulse'); confetti(12); }
      }
    };
    panel.append(h('h2', null, 'Experiment', h('button', { class: 'say', 'aria-label': 'Read aloud', onclick: () => readEls([noteEl], true) }, '🔊')),
      noteEl, h('h3', { style: 'font-size:1rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px' }, 'To do'), list, h('div', { class: 'spacer' }), next);
    try { exp.build(ctx); } catch (err) { console.error(err); next.disabled = false; }
    ctx.note(T(exp.instructions));
  },
  sResults({ stage, panel, T, lv, head, say, exp }) {
    const P = exp.predict[lv] || exp.predict.explorer;
    const ok = this.pred === P.answer;
    const box = h('div', { class: 'results' });
    if (this.pred != null) {
      box.append(h('div', { class: 'pred ' + (ok ? 'ok' : 'no') }, 'Your prediction: ' + P.options[this.pred],
        h('b', null, ok ? '✅ You predicted it!' : '🤔 Surprise! It was: ' + P.options[P.answer]),
        ok ? null : h('span', null, 'Surprises are how scientists learn new things.')));
    }
    const obs = exp.observations ? exp.observations(this.data, lv) : [];
    if (obs.length) {
      box.append(h('h3', null, 'What you saw'));
      const o = h('div', { class: 'obs' }); obs.forEach(x => o.append(h('span', null, x))); box.append(o);
    }
    stage.append(box);
    if (ok) confetti(10);
    panel.append(head('What happened?'), say(exp.result(lv, this.data)), h('div', { class: 'spacer' }),
      h('button', { class: 'btn', onclick: () => this.go(4) }, 'But why? ➜'));
  },
  sWhy({ stage, panel, T, lv, head, say, read, exp }) {
    const svg = this.newSvg(stage);
    try { if (exp.whyAnim) exp.whyAnim({ svg, scene: this.scene, level: lv, sci: lv === 'scientist' }); } catch (err) { console.error(err); }
    const hb = h('div', { class: 'homebox' }, h('h3', null, '🏠 Try it at home'));
    const hp = narr(T(exp.home)); read.push(hp); hb.append(hp);
    if (exp.safety) hb.append(h('div', { class: 'safety' }, '⚠️ ' + T(exp.safety)));
    panel.append(head('Why?'), say(T(exp.why)), hb, h('div', { class: 'spacer' }),
      h('button', { class: 'btn', onclick: () => this.go(5) }, 'Quiz time ➜'));
  },
  sQuiz({ stage, panel, lv, exp, read }) {
    stage.append(this.hero(exp));
    const qs = exp.quiz[lv] || exp.quiz.explorer;
    const show = (i) => {
      if (i >= qs.length) return this.win(stage, panel);
      const q = qs[i];
      const opts = h('div', { class: 'opts' });
      const order = shuffle(q.options.map((t, k) => ({ t, k })));
      const qp = narr(q.q);
      const fb = h('div', { class: 'narr', style: 'font-weight:800;min-height:1.6em' });
      order.forEach(o => {
        const b = h('button', { class: 'opt', onclick: () => {
          if (opts.dataset.done) return;
          if (o.k === q.answer) {
            opts.dataset.done = 1; b.classList.add('right');
            fb.replaceChildren(narr('Yes! That is right.')); readEls([fb]);
            this.scene.after(1500, () => show(i + 1));
          } else {
            b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong');
            fb.replaceChildren(narr('Not quite. Try again!')); readEls([fb]);
          }
        } }, h('span', { class: 'sent' }, o.t));
        opts.append(b);
      });
      panel.replaceChildren(h('h2', null, `Quiz  ${i + 1} / ${qs.length}`, h('button', { class: 'say', 'aria-label': 'Read aloud', onclick: () => readEls([qp, opts], true) }, '🔊')), qp, opts, fb);
      readEls([qp, opts]);
    };
    show(0);
  },
  win(stage, panel) {
    const me = Store.me, exp = this.exp;
    me.stars[exp.id] = true; Store.save();
    stage.replaceChildren(h('div', { class: 'starwin' }, h('div', null, h('div', { class: 's' }, '⭐'), h('h2', null, 'You earned a star!'))));
    const p = narr(`Great work, ${me.name}! You finished ${exp.title} like a real scientist.`);
    panel.replaceChildren(h('h2', null, 'Well done!'), p, h('div', { class: 'spacer' }),
      h('button', { class: 'btn ghost', onclick: () => this.open(exp) }, '↺ Do it again'),
      h('button', { class: 'btn', onclick: () => this.home() }, 'Back to the lab ➜'));
    confetti(40); readEls([p]);
  }
};

/* ===================== 5. Experiments ===================== */

/* ---------- 5.1  Sink or Float? ---------- */
Lab.register({
  id: 'sink-float', title: 'Sink or Float?', emoji: '🛁', color: '#0ea5e9', category: 'Water and matter',
  blurb: 'Drop things in water and see what happens.',
  bits: ['🍎', '🪨', '🦆', '🔑', '🧊', '🥚'],
  question: {
    explorer: 'Some things float on water. Some things sink to the bottom. Which ones will float?',
    scientist: 'A tiny coin sinks, but a giant ship floats. Why do some things float while others sink?'
  },
  predict: {
    explorer: { prompt: 'Will the apple float or sink?', options: ['🍎 It will float', '🍎 It will sink'], answer: 0 },
    scientist: { prompt: 'An egg sinks in normal water. What will happen if we stir lots of salt into the water?', options: ['The egg still sinks', 'The egg floats up', 'The egg gets heavier'], answer: 1 }
  },
  instructions: {
    explorer: 'Drag each thing into the water. Watch what happens!',
    scientist: 'Drop objects into the tank. Then move the salt slider and watch the egg closely.'
  },
  goals: {
    explorer: [{ id: 'test4', label: 'Drop 4 different things in the water' }],
    scientist: [{ id: 'test4', label: 'Test 4 different objects' }, { id: 'egg', label: 'Add salt until the egg floats' }]
  },
  items: [
    { id: 'apple', name: 'apple', emoji: '🍎', d: 0.80 }, { id: 'rock', name: 'rock', emoji: '🪨', d: 2.70 },
    { id: 'coin', name: 'coin', emoji: '🪙', d: 8.90 }, { id: 'duck', name: 'toy duck', emoji: '🦆', d: 0.30 },
    { id: 'wood', name: 'piece of wood', emoji: '🪵', d: 0.60 }, { id: 'key', name: 'key', emoji: '🔑', d: 8.00 },
    { id: 'ice', name: 'ice cube', emoji: '🧊', d: 0.92 }, { id: 'egg', name: 'egg', emoji: '🥚', d: 1.08 }
  ],
  build(ctx) {
    const { svg, scene, sci, data, controls } = ctx;
    data.tested = data.tested || {};
    const SURF = 270, BOT = 556, TX0 = 120, TX1 = 680, R = 30;
    let liquid = 1.0;
    S('rect', { x: 30, y: 122, width: 740, height: 12, rx: 6, fill: '#c89b6a' }, svg);
    const water = S('rect', { x: TX0, y: SURF, width: TX1 - TX0, height: BOT - SURF, fill: '#7cc8f5' }, svg);
    const gItems = S('g', {}, svg);
    const veil = S('rect', { x: TX0, y: SURF, width: TX1 - TX0, height: BOT - SURF, fill: '#7cc8f5', opacity: .35, 'pointer-events': 'none' }, svg);
    S('path', { d: `M${TX0},190 V${BOT + 4} H${TX1} V190`, fill: 'none', stroke: '#52708f', 'stroke-width': 8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'pointer-events': 'none' }, svg);
    const gFx = S('g', { 'pointer-events': 'none' }, svg);
    const dens = sci ? label(svg, 400, 588, '', 18) : null;

    const items = this.items.map((def, i) => {
      const it = { ...def, hx: 75 + i * 93, hy: 88, vy: 0, mode: 'shelf', t: 0, said: true };
      it.x = it.hx; it.y = it.hy;
      it.g = emojiItem(gItems, def.emoji, 52);
      if (sci) { label(svg, it.hx, 160, def.d.toFixed(2), 15); if (!i) label(svg, 400, 182, 'density in g/cm³', 13); }
      drag(it.g, svg, {
        start: () => { it.mode = 'drag'; gItems.appendChild(it.g); },
        move: p => { it.x = clamp(p.x, 30, 770); it.y = clamp(p.y, 30, BOT - R); },
        end: (p, p0) => {
          const moved = Math.hypot(p.x - p0.x, p.y - p0.y);
          if (moved < 8 && it.y < 150) {
            it.mode = 'return';
            ctx.note(sci ? `The ${it.name} has a density of ${it.d.toFixed(2)} g/cm³. Drag it into the tank to test it.` : `This is the ${it.name}. Drag it into the water!`);
          } else if (it.x > TX0 + 10 && it.x < TX1 - 10 && it.y > 150) {
            it.x = clamp(it.x, TX0 + R + 6, TX1 - R - 6); it.vy = 0; it.t = 0; it.said = false;
            if (it.y < SURF - R) it.mode = 'fall'; else { it.mode = 'water'; }
          } else it.mode = 'return';
        }
      });
      return it;
    });
    function splash(x) {
      for (let k = 0; k < 2; k++) {
        const c = S('ellipse', { cx: x, cy: SURF, rx: 10, ry: 4, fill: 'none', stroke: '#fff', 'stroke-width': 4 }, gFx);
        let t = -k * 0.15;
        const stop = scene.loop(dt => {
          t += dt; if (t < 0) return;
          c.setAttribute('rx', 10 + t * 130); c.setAttribute('ry', 4 + t * 26); c.setAttribute('opacity', 1 - t / 0.7);
          if (t > 0.7) { stop(); c.remove(); }
        });
      }
    }
    function announce(it) {
      const floats = it.d < liquid;
      it.said = true; it.floats = floats;
      const salty = liquid > 1.005;
      data.tested[it.id + (salty ? '-salt' : '')] = { id: it.id, floats, salty, name: it.name, emoji: it.emoji };
      if (sci) {
        ctx.note(`The ${it.name} ${floats ? 'floats' : 'sinks'}. Its density is ${it.d.toFixed(2)} g/cm³. That is ${floats ? 'less' : 'more'} than the water (${liquid.toFixed(2)} g/cm³).`);
      } else {
        ctx.note(floats ? `The ${it.name} floats! It stays on top of the water.` : `The ${it.name} sinks! It goes down to the bottom.`);
      }
      if (new Set(Object.values(data.tested).map(x => x.id)).size >= 4) ctx.goal('test4');
      if (it.id === 'egg' && floats) { data.eggFloated = true; ctx.goal('egg'); }
    }
    scene.loop(dt => {
      for (const it of items) {
        if (it.mode === 'return') {
          const k = Math.min(1, dt * 10);
          it.x += (it.hx - it.x) * k; it.y += (it.hy - it.y) * k;
          if (Math.abs(it.x - it.hx) + Math.abs(it.y - it.hy) < 1) { it.x = it.hx; it.y = it.hy; it.mode = 'shelf'; }
        } else if (it.mode === 'fall') {
          it.vy += 1600 * dt; it.y += it.vy * dt;
          if (it.y >= SURF - R) { it.mode = 'water'; it.vy *= 0.35; splash(it.x); }
        } else if (it.mode === 'water') {
          const f = clamp((it.y + R - SURF) / (2 * R), 0, 1);
          const a = 1600 * (1 - f * liquid / it.d) - 4.5 * it.vy * f - 0.4 * it.vy;
          it.vy += a * dt; it.y += it.vy * dt;
          if (it.y > BOT - R) { it.y = BOT - R; if (it.vy > 0) it.vy = 0; }
          if (!it.said) { it.t += dt; if (it.t > 1.3) announce(it); }
        }
        it.g.setAttribute('transform', `translate(${it.x.toFixed(1)},${it.y.toFixed(1)})`);
      }
    });
    function setSalt(v) {
      liquid = 1 + 0.2 * v / 100;
      const c = `rgb(${Math.round(124 + v * 0.55)},${Math.round(200 + v * 0.1)},${Math.round(245 - v * 0.25)})`;
      water.setAttribute('fill', c); veil.setAttribute('fill', c);
      if (dens) dens.textContent = `Water density: ${liquid.toFixed(2)} g/cm³`;
      items.forEach(it => { if (it.mode === 'water' && it.said && (it.d < liquid) !== it.floats) { it.said = false; it.t = 0.3; } });
    }
    if (sci) {
      const read = h('span', { class: 'read' }, 'no salt');
      const rng = h('input', { type: 'range', min: 0, max: 100, value: 0, 'aria-label': 'Salt', oninput: () => {
        const v = +rng.value; setSalt(v);
        read.textContent = v === 0 ? 'no salt' : v < 35 ? 'a little salt' : v < 70 ? 'salty' : 'very salty';
      } });
      controls.append(h('label', null, '🧂 Salt', rng), read);
      setSalt(0);
    }
    controls.append(h('button', { class: 'mini', onclick: () => items.forEach(it => { if (it.mode !== 'shelf' && it.mode !== 'drag') it.mode = 'return'; }) }, '↺ Put everything back'));
  },
  observations(data) {
    return Object.values(data.tested || {}).map(t => `${t.emoji} ${t.floats ? 'floats' : 'sinks'}${t.salty ? ' (salty water)' : ''}`);
  },
  result(lv, data) {
    const all = Object.values(data.tested || {}), plain = all.filter(x => !x.salty), t = plain.length ? plain : all;
    const up = t.filter(x => x.floats).map(x => 'the ' + x.name), down = t.filter(x => !x.floats).map(x => 'the ' + x.name);
    const cap = x => x.charAt(0).toUpperCase() + x.slice(1);
    let s = '';
    if (up.length) s += cap(`${listWords(up)} floated. `);
    if (down.length) s += cap(`${listWords(down)} sank. `);

      { q: 'Does a magnet pull every metal?', options: ['No, only some metals, like iron', 'Yes, every metal', 'No, it only pulls wood'], answer: 0 }
    ],
    scientist: [
      { q: 'Which poles attract each other?', options: ['North and south', 'North and north', 'South and south'], answer: 0 },
      { q: 'Which metal is not attracted to a magnet?', options: ['Copper', 'Iron', 'Steel'], answer: 0 },
      { q: 'What happens to the magnetic force when the magnet moves farther away?', options: ['It gets weaker', 'It gets stronger', 'It stays the same'], answer: 0 }
    ]
  }
});

/* ---------- 5.5  Volcano ---------- */
Lab.register({
  id: 'volcano', title: 'Volcano', emoji: '🌋', color: '#f97316', category: 'Chemistry',
  blurb: 'Mix baking soda and vinegar and watch it erupt.',
  bits: ['🥄', '🧴', '🫧', '💨', '🧪', '⛰️'],
  question: {
    explorer: 'We have baking soda and vinegar from the kitchen. What happens when they meet?',
    scientist: 'Some things change into brand new things when they mix. How can two kitchen ingredients make a foamy eruption?'
  },
  predict: {
    explorer: { prompt: 'What will happen when vinegar meets baking soda?', options: ['It will fizz and bubble up', 'Nothing will happen', 'It will turn into ice'], answer: 0 },
    scientist: { prompt: 'You pour a small amount of vinegar onto 3 spoons of baking soda. Will all the baking soda react?', options: ['Yes, all of it', 'No, some will be left over', 'It will not react at all'], answer: 1 }
  },
  instructions: {
    explorer: 'Drag the spoon of baking soda into the volcano. Then drag the vinegar bottle to the top!',
    scientist: 'Add spoons of baking soda, choose how much vinegar to use, then drag the bottle to the crater. Compare different mixes.'
  },
  goals: {
    explorer: [{ id: 'soda', label: 'Put baking soda in the volcano' }, { id: 'erupt', label: 'Make the volcano erupt' }, { id: 'big', label: 'Make a giant eruption with 3 spoons' }],
    scientist: [{ id: 'erupt', label: 'Make the volcano erupt' }, { id: 'two', label: 'Try 2 different mixes' }, { id: 'big', label: 'Make the biggest eruption: 30 cm' }]
  },
  build(ctx) {
    const { svg, scene, sci, data, controls } = ctx;
    data.runs = data.runs || [];
    let spoons = 0, vin = sci ? 60 : 180, busy = false;
    S('rect', { x: 0, y: 540, width: 800, height: 60, fill: '#86efac' }, svg);
    S('polygon', { points: '130,550 360,250 440,250 670,550', fill: '#92400e' }, svg);
    S('polygon', { points: '360,250 440,250 475,295 325,295', fill: '#78350f' }, svg);
    S('ellipse', { cx: 400, cy: 250, rx: 40, ry: 10, fill: '#451a03' }, svg);
    S('ellipse', { cx: 400, cy: 232, rx: 90, ry: 48, fill: 'none', stroke: '#f97316', 'stroke-width': 3, 'stroke-dasharray': '8 8' }, svg);
    const gFoam = S('g', { 'pointer-events': 'none' }, svg);
    const info = label(svg, 400, 580, 'The volcano is empty', 20, '#14532d');
    const meter = sci ? label(svg, 400, 40, '', 24, '#1f2a44') : null;
    label(svg, 110, 280, 'Baking soda', 17); label(svg, 690, 280, 'Vinegar', 17);
    const mk = (emoji, hx, hy, onDrop) => {
      const o = { x: hx, y: hy, hx, hy, back: false };
      o.g = emojiItem(svg, emoji, 66);
      drag(o.g, svg, {
        start: () => { o.back = false; },
        move: p => { o.x = clamp(p.x, 40, 760); o.y = clamp(p.y, 40, 520); },
        end: () => { if (Math.abs(o.x - 400) < 105 && o.y > 140 && o.y < 330) onDrop(); o.back = true; }
      });
      return o;
    };
    const refresh = () => { info.textContent = spoons ? `Baking soda in the volcano: ${spoons} spoon${spoons > 1 ? 's' : ''}` : 'The volcano is empty'; };
    const spoon = mk('🥄', 110, 210, () => {
      if (busy) return;
      if (spoons >= 3) return ctx.note('That is enough baking soda. Now pour the vinegar!');
      spoons++; refresh(); ctx.goal('soda');
      ctx.note(spoons === 1 ? 'One spoon of baking soda is in the volcano. Add more, or pour the vinegar!' : `${spoons} spoons of baking soda are in. Now pour the vinegar!`);
    });
    const bottle = mk('🧴', 690, 210, () => {
      if (busy) return;
      if (!spoons) return ctx.note(sci ? 'Nothing happens. Vinegar alone has nothing to react with. Add baking soda first.' : 'Nothing happens! The vinegar needs baking soda. Add a spoon first.');
      erupt();
    });
    const parts = [], cols = ['#fb923c', '#f87171', '#fde68a', '#fdba74'];
    const coneY = x => 250 + Math.max(0, Math.abs(x - 400) - 40) * 1.304;
    function spawn(gas) {
      const el = S('circle', { r: 7 + Math.random() * 7, fill: cols[parts.length % 4], stroke: '#fff', 'stroke-width': 1.5 }, gFoam);
      parts.push({ el, x: 400 + (Math.random() - .5) * 50, y: 248, vx: (Math.random() - .5) * (120 + gas * 70), vy: -(170 + gas * 110) * (0.6 + Math.random() * 0.5), life: 3.2, slide: 0 });
    }
    function erupt() {
      busy = true;
      const need = spoons * 60, gas = Math.min(spoons, vin / 60), cm = Math.round(gas * 10);
      data.runs.push({ s: spoons, v: vin, cm });
      let t = 0, made = 0; const total = Math.round(45 * gas), dur = 1.2 + gas * 0.8;
      const stop = scene.loop(dt => {
        t += dt;
        while (made < total && made < total * t / dur) { made++; spawn(gas); }
        if (t > dur + 3.5) { stop(); busy = false; spoons = 0; refresh(); }
      });
      if (meter) meter.textContent = `Foam height: ${cm} cm`;
      if (sci) {
        if (vin < need) data.leftSoda = true;
        ctx.note(`${spoons} spoon${spoons > 1 ? 's' : ''} of baking soda and ${vin} ml of vinegar. The foam rises ${cm} cm. ` +
          (vin < need ? 'Some baking soda is left over. There was not enough vinegar to react with all of it.' : vin > need ? 'Some vinegar is left over. All the baking soda was used up.' : 'A perfect mix! Nothing is left over.'));
      } else {
        ctx.note(gas >= 3 ? 'WOW! A giant eruption! Three spoons make lots and lots of foam.' : gas >= 2 ? 'Whoosh! A bigger eruption! Can you make it even bigger?' : 'Fizz! The volcano erupts! Try more baking soda for a bigger eruption.');
      }
      ctx.goal('erupt');
      if (gas >= 3) ctx.goal('big');
      if (new Set(data.runs.map(r => r.s + '-' + r.v)).size >= 2) ctx.goal('two');
    }
    scene.loop(dt => {
      for (const o of [spoon, bottle]) {
        if (o.back) { const k = Math.min(1, dt * 9); o.x += (o.hx - o.x) * k; o.y += (o.hy - o.y) * k; }
        o.g.setAttribute('transform', `translate(${o.x.toFixed(1)},${o.y.toFixed(1)})`);
      }
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i]; p.life -= dt;
        if (p.slide) { p.x += p.slide * 45 * dt; p.y = coneY(p.x) - 4; }
        else {
          p.vy += 520 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
          if (p.vy > 0 && p.y >= coneY(p.x) - 4) p.slide = p.x >= 400 ? 1 : -1;
        }
        p.el.setAttribute('cx', p.x.toFixed(1)); p.el.setAttribute('cy', p.y.toFixed(1)); p.el.setAttribute('opacity', clamp(p.life / 0.8, 0, 1));
        if (p.life <= 0 || p.y > 545) { p.el.remove(); parts.splice(i, 1); }
      }
    });
    if (sci) controls.append(seg('🧴 Vinegar', [60, 120, 180].map(v => ({ v, t: v + ' ml' })), 60, v => { vin = v; }));
  },
  observations(data, lv) {
    return (data.runs || []).slice(-8).map(r => lv === 'scientist' ? `🥄 ${r.s} + 🧴 ${r.v} ml → ${r.cm} cm` : `🥄 ${r.s} → 🌋 ${r.cm >= 30 ? 'giant' : r.cm >= 20 ? 'big' : 'small'}`);
  },
  result(lv, data) {
    if (lv === 'scientist') {
      return 'The vinegar and baking soda reacted and made foam. More of both ingredients made a taller eruption. ' +
        (data.leftSoda ? 'When there was too little vinegar, some baking soda was left over and the foam stayed low. ' : '') +
        'Adding more of only one ingredient did not help once the other one ran out.';
    }
    return 'The vinegar touched the baking soda and it fizzed! Foam shot up and ran down the sides. More baking soda made a bigger eruption.';
  },
  why: {
    explorer: 'Vinegar and baking soda do not just mix. They change into something new! They make lots of tiny gas bubbles. The bubbles push the foam up and out, just like a volcano.',
    scientist: 'This is a chemical reaction. Vinegar is an acid. Baking soda is a base. When they meet, they react and make three new things: water, a kind of salt, and carbon dioxide gas. The gas makes bubbles that push the foam out. The reaction stops when one ingredient runs out. A real volcano is different. It erupts because hot melted rock and gas push up from deep underground.'
  },
  whyAnim({ svg, scene, sci }) {
    if (!sci) {
      S('path', { d: 'M280,150 V500 Q280,530 310,530 H490 Q520,530 520,500 V150', fill: '#fff7ed', stroke: '#9ca3af', 'stroke-width': 8, 'stroke-linejoin': 'round' }, svg);
      const liquid = S('rect', { x: 284, width: 232, fill: '#fdba74' }, svg);
      const bub = Array.from({ length: 22 }, (_, i) => ({ el: S('circle', { fill: '#fff', stroke: '#fb923c', 'stroke-width': 3 }, svg), x: 300 + (i * 53) % 200, ph: i * 0.37, r: 8 + (i % 4) * 4 }));
      label(svg, 400, 80, 'Gas bubbles push the foam up', 32, '#1f2a44');
      scene.loop((dt, t) => {
        const lvl = 420 - 170 * (0.5 + 0.5 * Math.sin(t * 0.9));
        liquid.setAttribute('y', lvl); liquid.setAttribute('height', 526 - lvl);
        bub.forEach(b => {
          const k = (t * 0.5 + b.ph) % 1, y = 520 - k * (520 - lvl);
          b.el.setAttribute('cx', b.x + Math.sin(t * 3 + b.ph * 9) * 6); b.el.setAttribute('cy', y); b.el.setAttribute('r', b.r * (0.5 + k * 0.6));
        });
      });
      return;
    }
    label(svg, 400, 60, 'acid + base → water + salt + carbon dioxide', 26, '#1f2a44');
    const mk = (fill, text, r) => { const g = S('g', {}, svg); S('circle', { r, fill, stroke: '#0003', 'stroke-width': 3 }, g); label(g, 0, 7, text, 19, '#1f2a44'); return g; };
    const acid = mk('#fca5a5', 'acid', 52), base = mk('#93c5fd', 'base', 52);
    const water = mk('#bae6fd', 'water', 44), salt = mk('#f1f5f9', 'salt', 40), gas = mk('#d1d5db', 'CO₂', 48);
    const flash = S('circle', { cx: 400, cy: 320, r: 70, fill: '#fde047', opacity: 0 }, svg);
    label(svg, 400, 560, 'The carbon dioxide gas makes the bubbles', 24, '#1f2a44');
    const put = (g, x, y, o) => { g.setAttribute('transform', `translate(${x},${y})`); g.setAttribute('opacity', o); };
    scene.loop((dt, t) => {
      const c = t % 5, a = clamp(c / 1.5, 0, 1), b = clamp((c - 1.7) / 1.6, 0, 1);
      put(acid, 150 + 200 * a, 320, c < 1.6 ? 1 : 0); put(base, 650 - 200 * a, 320, c < 1.6 ? 1 : 0);
      flash.setAttribute('opacity', c > 1.5 && c < 1.9 ? 0.8 : 0);
      const o = c > 1.7 ? (c > 4.5 ? (5 - c) * 2 : 1) : 0;
      put(water, 400 - 190 * b, 320 + 90 * b, o); put(salt, 400 + 190 * b, 320 + 90 * b, o); put(gas, 400, 320 - 170 * b, o);
    });
  },
  home: 'With a grown-up, put two spoons of baking soda in a cup. Stand the cup on a tray. Pour in some vinegar and watch! A drop of dish soap makes even more foam.',
  safety: 'Do this on a tray or outside. Do not taste it, and keep it away from your eyes.',
  quiz: {
    explorer: [
      { q: 'What makes the foam rise?', options: ['Gas bubbles', 'Ice', 'Sand'], answer: 0 },
      { q: 'What do we pour onto the baking soda?', options: ['Vinegar', 'Milk', 'Honey'], answer: 0 }
    ],
    scientist: [
      { q: 'What kind of liquid is vinegar?', options: ['An acid', 'A base', 'A metal'], answer: 0 },
      { q: 'Which gas is made in this reaction?', options: ['Carbon dioxide', 'Oxygen', 'Helium'], answer: 0 },
      { q: 'Why does the reaction stop?', options: ['One ingredient runs out', 'The foam gets too cold', 'The gas turns back into vinegar'], answer: 0 }
    ]
  }
});
